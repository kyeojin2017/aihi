<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건강비서 — 비밀번호 재설정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-name">건강비서</span>
    </div>

    <p class="auth-subtitle" id="resetSubtitle">새 비밀번호를 입력해주세요.</p>

    <div id="authMessage"></div>

    <form class="auth-form" id="resetForm">
      <div class="auth-field">
        <label for="newPassword">새 비밀번호</label>
        <input type="password" id="newPassword" autocomplete="new-password" required minlength="8" placeholder="8자 이상">
      </div>
      <div class="auth-field">
        <label for="newPasswordConfirm">새 비밀번호 확인</label>
        <input type="password" id="newPasswordConfirm" autocomplete="new-password" required minlength="8" placeholder="비밀번호 다시 입력">
      </div>
      <button type="submit" class="btn btn-primary auth-submit" id="resetSubmitBtn">비밀번호 변경</button>
    </form>

    <p class="auth-hint"><a href="login.html">로그인으로 돌아가기</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabaseConfig.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/resetPassword.js"></script>
</body>
</html>
